<!-- @dsCard group="Components" viewport="700x360" name="Forms" subtitle="Buttons, inputs, select, checkbox, switch" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-base); }
  .stack { display: flex; flex-direction: column; gap: 20px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 8px; }
  .col { display: flex; flex-direction: column; gap: 10px; min-width: 200px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Button, IconButton, Input, Select, Checkbox, Switch } = window.ClaudeInDesignSystem_25db6c;
  const Search = () => <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.2" stroke="currentColor" strokeWidth="1.4"/><path d="M9.2 9.2 L12 12" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>;
  function Demo() {
    const [on, setOn] = React.useState(true);
    const [chk, setChk] = React.useState(true);
    return (
      <div className="stack">
        <div>
          <div className="lbl">Buttons</div>
          <div className="row">
            <Button intent="primary">Primary</Button>
            <Button intent="secondary">Secondary</Button>
            <Button intent="outline">Outline</Button>
            <Button intent="ghost">Ghost</Button>
            <Button intent="danger">Delete</Button>
            <Button intent="primary" loading>Saving</Button>
            <Button intent="secondary" disabled>Disabled</Button>
          </div>
          <div className="row" style={{ marginTop: 12 }}>
            <Button intent="primary" size="sm">Small</Button>
            <Button intent="primary" size="md">Medium</Button>
            <Button intent="primary" size="lg">Large</Button>
            <IconButton aria-label="search" intent="outline"><Search/></IconButton>
            <IconButton aria-label="search" active><Search/></IconButton>
          </div>
        </div>
        <div className="row" style={{ alignItems: 'flex-start', gap: 24 }}>
          <div className="col">
            <div className="lbl">Inputs</div>
            <Input placeholder="Search projects…" leadingIcon={<Search/>} defaultValue="" />
            <Input mono placeholder="~/code/claudein" defaultValue="~/code/claudein" />
            <Input invalid defaultValue="invalid value" />
          </div>
          <div className="col" style={{ minWidth: 160 }}>
            <div className="lbl">Select &amp; toggles</div>
            <Select options={[{value:'sonnet',label:'Claude Sonnet'},{value:'opus',label:'Claude Opus'},{value:'haiku',label:'Claude Haiku'}]} />
            <Checkbox checked={chk} onChange={() => setChk(v=>!v)} label="Auto-approve edits" />
            <Switch checked={on} onChange={() => setOn(v=>!v)} label="Live updates" />
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
