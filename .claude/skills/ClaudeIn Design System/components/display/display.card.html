<!DOCTYPE html>

<script src="../../_ds_bundle.js"></script>
<script type="text/babel">

    return (
      <div className="stack">
        <div>

            <Badge tone="warning">auth</Badge>

            <Badge tone="info">sub-agent</Badge>
            <Badge tone="history">memory</Badge>
            <Badge tone="neutral" mono={false}>Draft</Badge>
            <Badge tone="accent" shape="pill">12 tokens</Badge>

        </div>
        <div>

            <span style={{display:'inline-flex',gap:4}}><Kbd>⌘</Kbd><Kbd>K</Kbd></span>

              <div style={{display:'flex',alignItems:'center',gap:10}}>
