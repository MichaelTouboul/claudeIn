<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-base); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
  .lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Dialog, Menu, Button } = window.ClaudeInDesignSystem_25db6c;
  function Demo() {
    const [open, setOpen] = React.useState(false);
    return (
      <div className="row">
        <div>
          <div className="lbl">Dialog</div>
          <Button intent="primary" onClick={() => setOpen(true)}>Open dialog</Button>
          <Dialog
            open={open}
            onClose={() => setOpen(false)}
            title="Delete session?"
            description="This permanently removes the conversation and its scrollback."
            footer={<><Button intent="ghost" onClick={() => setOpen(false)}>Cancel</Button><Button intent="danger-solid" onClick={() => setOpen(false)}>Delete</Button></>}
          >
            <div style={{color:'var(--text-secondary)',fontSize:14}}>Session <span style={{fontFamily:'var(--font-mono)',color:'var(--text-primary)'}}>refactor-auth</span> · 24 messages.</div>
          </Dialog>
        </div>
        <div>
          <div className="lbl">Menu</div>
          <Menu
            trigger={<Button intent="secondary">Actions ▾</Button>}
            items={[
              { label: 'Rename', onSelect: () => {} },
              { label: 'Duplicate', shortcut: '⌘D', onSelect: () => {} },
              { label: 'Open in panel', onSelect: () => {} },
              { separator: true },
              { label: 'Delete', tone: 'danger', onSelect: () => {} },
            ]}
          />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
