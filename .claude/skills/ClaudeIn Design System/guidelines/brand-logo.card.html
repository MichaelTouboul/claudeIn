<!-- @dsCard group="Brand" viewport="700x230" name="Logo" subtitle="Aperture mark — app icon, favicon, monochrome, wordmark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 28px; background: var(--surface-base); display: flex; align-items: center; gap: 40px; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .cap { font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); }
  .onlight { background: #eef1f6; padding: 14px; border-radius: var(--radius-lg); }
  .lockup { display: flex; align-items: center; gap: 11px; }
  .word { font-family: var(--font-sans); font-size: 24px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-primary); }
  .word .in { color: var(--accent-text); }
</style>
</head>
<body>
  <div class="item">
    <img src="../assets/claudein-icon.svg" width="76" height="76" alt="ClaudeIn app icon">
    <span class="cap">app icon</span>
  </div>
  <div class="item">
    <img src="../assets/claudein-favicon.svg" width="32" height="32" alt="ClaudeIn favicon">
    <span class="cap">favicon</span>
  </div>
  <div class="item">
    <div class="onlight"><img src="../assets/claudein-icon.svg" width="56" height="56" alt="ClaudeIn on light"></div>
    <span class="cap">on light</span>
  </div>
  <div class="item">
    <img src="../assets/claudein-icon-mono.svg" width="56" height="56" alt="ClaudeIn monochrome">
    <span class="cap">mono fallback</span>
  </div>
  <div class="item">
    <div class="lockup">
      <img src="../assets/claudein-icon.svg" width="40" height="40" alt="">
      <span class="word">Claude<span class="in">In</span></span>
    </div>
    <span class="cap">lockup</span>
  </div>
</body>
</html>
