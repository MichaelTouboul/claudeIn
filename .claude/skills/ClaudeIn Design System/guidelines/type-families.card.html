<!-- @dsCard group="Type" viewport="700x180" name="Font families" subtitle="Geist for UI · Geist Mono for code & data" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-base); display: flex; gap: 40px; }
  .col { flex: 1; }
  .tag { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 12px; }
  .big { font-size: 46px; line-height: 1; color: var(--text-primary); letter-spacing: -0.02em; }
  .meta { margin-top: 12px; font-size: 12px; color: var(--text-secondary); }
  .name { color: var(--accent-text); }
</style>
</head>
<body>
  <div class="col">
    <div class="tag">Interface</div>
    <div class="big" style="font-family:var(--font-sans)">Aa Gg</div>
    <div class="meta"><span class="name">Geist</span> · 400 / 500 / 600 / 700<br>Headings, labels, body, buttons</div>
  </div>
  <div class="col">
    <div class="tag">Code &amp; data</div>
    <div class="big" style="font-family:var(--font-mono)">Aa Gg</div>
    <div class="meta"><span class="name">Geist Mono</span> · 400 / 500 / 600<br>Paths, IDs, counts, diffs, logs</div>
  </div>
</body>
</html>
