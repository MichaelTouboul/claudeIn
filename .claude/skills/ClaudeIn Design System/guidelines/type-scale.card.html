<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="14px body base · comfortable line-heights" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-base); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; }
  .txt { color: var(--text-primary); flex: 1; }
  .tok { font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); white-space: nowrap; }
</style>
</head>
<body>
  <div class="row"><span class="txt" style="font-size:var(--text-4xl);line-height:var(--leading-4xl);font-weight:700;letter-spacing:-0.02em">Display</span><span class="tok">4xl · 38</span></div>
  <div class="row"><span class="txt" style="font-size:var(--text-2xl);line-height:var(--leading-2xl);font-weight:600;letter-spacing:-0.01em">Page title</span><span class="tok">2xl · 24</span></div>
  <div class="row"><span class="txt" style="font-size:var(--text-xl);line-height:var(--leading-xl);font-weight:600">Section heading</span><span class="tok">xl · 20</span></div>
  <div class="row"><span class="txt" style="font-size:var(--text-md);line-height:var(--leading-md);font-weight:500">Card title / emphasis</span><span class="tok">md · 15</span></div>
  <div class="row"><span class="txt" style="font-size:var(--text-base);line-height:var(--leading-base)">Body — the default reading size for paragraphs and most UI copy.</span><span class="tok">base · 14</span></div>
  <div class="row"><span class="txt" style="font-size:var(--text-sm);line-height:var(--leading-sm);color:var(--text-secondary)">Small — secondary descriptions</span><span class="tok">sm · 13</span></div>
  <div class="row"><span class="txt overline">Overline / section label</span><span class="tok">xs caps · 12</span></div>
</body>
</html>
