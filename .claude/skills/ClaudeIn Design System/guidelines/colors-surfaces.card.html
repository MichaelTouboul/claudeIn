<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Elevation ladder — soft blue-charcoal, not pure black" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-base); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .sw { border-radius: var(--radius-md); border: 1px solid var(--border); overflow: hidden; }
  .chip { height: 64px; }
  .meta { padding: 8px 10px; }
  .name { font-size: 12px; font-weight: 600; color: var(--text-primary); }
  .val { font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
</style>
</head>
<body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:var(--surface-base)"></div><div class="meta"><div class="name">base</div><div class="val">#14161b</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--surface-1)"></div><div class="meta"><div class="name">surface-1</div><div class="val">#1d2027</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--surface-2)"></div><div class="meta"><div class="name">surface-2</div><div class="val">#23272f</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--surface-3)"></div><div class="meta"><div class="name">surface-3</div><div class="val">#2b2f39</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--surface-inset)"></div><div class="meta"><div class="name">inset</div><div class="val">#0f1115</div></div></div>
</div>
</body>
</html>
