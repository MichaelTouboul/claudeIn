<!-- @dsCard group="Dashboard" viewport="680x860" name="Panneau Table (data-grid) — refacto" subtitle="Le tableau ouvert en panneau : tri, badges, export, transform" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaudeIn — Table panel</title>
<link rel="icon" type="image/svg+xml" href="./assets/claudein-favicon.svg">
<link rel="stylesheet" href="./styles.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; background: var(--surface-base); color: var(--text-primary); }
  #root { height: 100vh; }
  .panel { height: 100vh; width: 660px; max-width: 100%; margin: 0 auto; display: flex; flex-direction: column; background: var(--surface-1); border-left: 1px solid var(--border); }
  .phead { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border-subtle); flex-shrink: 0; }
  .phead .ttl { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .toolbar { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border-subtle); flex-shrink: 0; }
  .xbtn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; font-size: 13px; color: var(--text-secondary); background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; transition: background var(--duration-fast) var(--ease-standard); }
  .xbtn:hover { background: var(--surface-3); color: var(--text-primary); }
  .gridwrap { flex: 1; min-height: 0; overflow: auto; }
  .grid { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
  .grid thead th { position: sticky; top: 0; z-index: 1; text-align: left; background: var(--surface-2); color: var(--text-secondary); font-weight: 600; font-size: 12px; letter-spacing: 0.02em; padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
  .grid thead th:hover { color: var(--text-primary); }
  .grid thead th .sort { display: inline-flex; align-items: center; gap: 5px; }
  .grid thead th .caret { color: var(--accent-text); display: inline-flex; }
  .grid tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border-subtle); color: var(--text-secondary); vertical-align: middle; }
  .grid tbody tr:hover td { background: var(--surface-2); }
  .grid tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--surface-base) 50%, transparent); }
  .grid tbody tr:nth-child(even):hover td { background: var(--surface-2); }
  .grid td.strong { color: var(--text-primary); font-weight: 500; }
  .idx { color: var(--text-tertiary); font-family: var(--font-mono); font-size: 12px; width: 30px; text-align: right; }
  .pfoot { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-top: 1px solid var(--border-subtle); flex-shrink: 0; font-size: 12.5px; color: var(--text-tertiary); }
  .pfoot span { white-space: nowrap; }
  .transform { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--surface-base); flex-shrink: 0; }
  .tinput { flex: 1; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; background: var(--surface-inset); border: 1px solid var(--border-strong); border-radius: var(--radius-md); color: var(--text-tertiary); font-size: 13px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="./_ds_bundle.js"></script>
<script type="text/babel" src="./icons.jsx"></script>
<script type="text/babel">
const { useState } = React;
const { Badge, Button, IconButton, Select, Tooltip } = window.ClaudeInDesignSystem_25db6c;
const Ic = window.ClaudeInIcons;

const ROWS = [
  { pillar:'UX beyond the terminal', feat:'Chat avec syntax highlighting & diffs', status:'done' },
  { pillar:'Visualize ecosystem', feat:'Browser de memories / sub-agents / skills', status:'wip' },
  { pillar:'Multi-project dashboards', feat:'Workspace multi-projets en onglets', status:'done' },
  { pillar:'In-app task management', feat:'Vue Jira intégrée', status:'planned' },
  { pillar:'Context optimization', feat:'Compaction intelligente & pruning mémoire', status:'planned' },
];
const STATUS = {
  done: <Badge tone="success" dot>Fait</Badge>,
  wip: <Badge tone="warning" dot>En cours</Badge>,
  planned: <Badge tone="neutral" dot>Prévu</Badge>,
};
const ORDER = { done:0, wip:1, planned:2 };

function App() {
  const [sort, setSort] = useState({ key:'pillar', dir:1 });
  const toggle = (key) => setSort((s) => s.key === key ? { key, dir:-s.dir } : { key, dir:1 });
  const rows = [...ROWS].sort((a, b) => {
    const av = sort.key === 'status' ? ORDER[a.status] : a[sort.key];
    const bv = sort.key === 'status' ? ORDER[b.status] : b[sort.key];
    return (av > bv ? 1 : av < bv ? -1 : 0) * sort.dir;
  });
  const Caret = () => <span className="caret"><Ic.IconChevronDown s={13} style={{ transform: sort.dir < 0 ? 'rotate(180deg)' : 'none' }} /></span>;
  const Th = ({ k, children, right }) => (
    <th onClick={() => toggle(k)} style={{ textAlign: right ? 'right' : 'left' }}>
      <span className="sort" style={{ justifyContent: right ? 'flex-end' : 'flex-start' }}>{children}{sort.key === k ? <Caret /> : null}</span>
    </th>
  );

  return (
    <div className="panel">
      <div className="phead">
        <span className="ttl"><span style={{ color:'var(--accent-text)', display:'flex' }}><Ic.IconDatabase s={17} /></span> Table</span>
        <Badge tone="neutral" shape="pill">5 rows</Badge>
        <div style={{ flex:1 }} />
        <IconButton aria-label="Close"><Ic.IconX s={16} /></IconButton>
      </div>

      <div className="toolbar">
        <span className="xbtn"><Ic.IconFile s={14} /> Excel</span>
        <span className="xbtn"><Ic.IconFile s={14} /> PDF</span>
        <span className="xbtn"><Ic.IconCopy s={14} /> Copy</span>
        <div style={{ flex:1 }} />
        <Tooltip label="Filter"><IconButton aria-label="Filter" size="sm"><Ic.IconSearch s={15} /></IconButton></Tooltip>
      </div>

      <div className="gridwrap">
        <table className="grid">
          <thead>
            <tr>
              <th className="idx" style={{ cursor:'default' }}>#</th>
              <Th k="pillar">Pillar</Th>
              <Th k="feat">Fonctionnalité</Th>
              <Th k="status">Statut</Th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r, i) => (
              <tr key={r.pillar}>
                <td className="idx">{i + 1}</td>
                <td className="strong">{r.pillar}</td>
                <td>{r.feat}</td>
                <td>{STATUS[r.status]}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="pfoot">
        <span>Rows per page</span>
        <Select size="sm" options={[{value:'25',label:'25'},{value:'50',label:'50'},{value:'100',label:'100'}]} />
        <div style={{ flex:1 }} />
        <span className="mono">1–5 of 5</span>
        <IconButton aria-label="Previous" size="sm" disabled><Ic.IconChevron s={15} style={{ transform:'rotate(180deg)' }} /></IconButton>
        <IconButton aria-label="Next" size="sm" disabled><Ic.IconChevron s={15} /></IconButton>
      </div>

      <div className="transform">
        <div className="tinput"><span style={{ color:'var(--accent-text)', display:'flex' }}><Ic.IconSparkles s={15} /></span> Ask to transform this (e.g. add a total column)…</div>
        <Button intent="primary">Run</Button>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
