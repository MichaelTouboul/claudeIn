<!-- @dsCard group="Dashboard" viewport="1280x720" name="Library — vue complète" subtitle="Navigateur Agents / Skills / Hooks / MCP" -->
<!-- @startingPoint section="Screens" subtitle="ClaudeIn library browser" viewport="1280x800" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaudeIn — Library</title>
<link rel="icon" type="image/svg+xml" href="../../assets/claudein-favicon.svg">
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; background: var(--surface-base); color: var(--text-primary); }
  #root { height: 100vh; }
  .app { height: 100vh; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 12px; height: var(--header-height); padding: 0 16px; background: var(--surface-1); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  .crumb { color: var(--text-tertiary); font-size: 14px; }
  .main { flex: 1; min-height: 0; display: flex; }
  .rail { width: var(--sidebar-width); flex-shrink: 0; background: var(--surface-1); border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; padding: 14px 12px; }
  .nav { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
  .navitem { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border: none; background: transparent; border-radius: var(--radius-md); color: var(--text-secondary); font-family: var(--font-sans); font-size: 14px; cursor: pointer; text-align: left; width: 100%; transition: background var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard); }
  .navitem:hover { background: var(--surface-2); color: var(--text-primary); }
  .navitem.on { background: var(--accent-subtle); color: var(--accent-text); font-weight: 500; }
  .navitem .cnt { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); }
  .navitem.on .cnt { color: var(--accent-text); }
  .content { flex: 1; min-width: 0; overflow-y: auto; }
  .chead { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 26px 28px 0; }
  .chead h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .chead p { margin-top: 6px; color: var(--text-secondary); font-size: 14px; max-width: 58ch; }
  .toolbar { display: flex; align-items: center; gap: 12px; padding: 18px 28px 16px; }
  .body { padding: 0 28px 32px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .meta { display: flex; align-items: center; gap: 8px; color: var(--text-tertiary); font-size: 12px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="./icons.jsx"></script>
<script type="text/babel">
const { useState } = React;
const { Button, Badge, Avatar, Card, Tag, Input, Switch, StatusDot, SegmentedControl, IconButton } = window.ClaudeInDesignSystem_25db6c;
const Ic = window.ClaudeInIcons;
const HUE = { cyan:'var(--agent-cyan)', blue:'var(--agent-blue)', green:'var(--agent-green)', yellow:'var(--agent-yellow)', orange:'var(--agent-orange)', red:'var(--agent-red)', purple:'var(--agent-purple)', pink:'var(--agent-pink)' };

const NAV = [
  { id:'agents', label:'Agents', icon:<Ic.IconBot s={16} />, count:25 },
  { id:'skills', label:'Skills', icon:<Ic.IconSparkles s={16} />, count:10 },
  { id:'hooks', label:'Hooks', icon:<Ic.IconZap s={16} />, count:1 },
  { id:'mcp', label:'MCP servers', icon:<Ic.IconPlug s={16} />, count:4 },
];

const AGENTS = [
  { id:'g', name:'claude-md-guardian', hue:'purple', desc:'Keeps CLAUDE.md files accurate', scope:'project', model:'Sonnet', running:true },
  { id:'mr', name:'migration-reviewer', hue:'blue', desc:'Reviews DB migrations for safety', scope:'project', model:'Opus' },
  { id:'rv', name:'reviewer', hue:'green', desc:'Reviews diffs for bugs & style', scope:'user', model:'Sonnet' },
  { id:'rf', name:'refactorer', hue:'pink', desc:'Safe multi-file refactors', scope:'user', model:'Opus', running:true },
  { id:'cr', name:'code-reviewer', hue:'green', desc:'Reviews PRs against conventions', scope:'plugin', source:'quality', model:'Sonnet' },
  { id:'sa', name:'security-audit', hue:'red', desc:'Audits dependencies for CVEs', scope:'plugin', source:'security', model:'Sonnet' },
];
const SKILLS = [
  { n:'pdf-extract', d:'Pull text & tables out of PDFs', s:'project' },
  { n:'changelog', d:'Draft a release changelog from commits', s:'user' },
  { n:'a11y-audit', d:'Check a component for WCAG issues', s:'project' },
  { n:'sql-explain', d:'Explain & optimize a SQL query', s:'user' },
  { n:'api-mock', d:'Spin up a mock from an OpenAPI spec', s:'plugin' },
  { n:'commit-msg', d:'Write a conventional commit message', s:'user' },
];
const HOOKS = [
  { event:'PreToolUse', matcher:'Bash', cmd:'./.claude/hooks/guard.sh', on:true },
  { event:'PostToolUse', matcher:'Edit|Write', cmd:'npm run lint:fix', on:true },
  { event:'Stop', matcher:'*', cmd:'./.claude/hooks/notify.sh', on:false },
];
const MCP = [
  { name:'filesystem', transport:'stdio', tools:8, status:'connected' },
  { name:'github', transport:'http', tools:26, status:'connected' },
  { name:'postgres', transport:'stdio', tools:0, status:'error' },
  { name:'linear', transport:'http', tools:14, status:'connected' },
];

function AgentTile({ hue, running }) {
  return (
    <span style={{ position:'relative', width:34, height:34, flexShrink:0, borderRadius:'var(--radius-md)', display:'flex', alignItems:'center', justifyContent:'center',
      background:`color-mix(in srgb, ${HUE[hue]} 16%, var(--surface-2))`, border:`1px solid color-mix(in srgb, ${HUE[hue]} 32%, transparent)`, color:HUE[hue] }}>
      <Ic.IconBot s={18} />
      {running ? <span style={{ position:'absolute', top:-3, right:-3, width:10, height:10, borderRadius:'50%', background:'var(--success)', border:'2px solid var(--surface-2)' }} /> : null}
    </span>
  );
}

function ScopeBadge({ scope, source }) {
  if (scope === 'project') return <Badge tone="info">project</Badge>;
  if (scope === 'user') return <Badge tone="neutral">user</Badge>;
  return <Badge tone="history" dot>{source}</Badge>;
}

function Agents() {
  const [tab, setTab] = useState('all');
  const list = AGENTS.filter((a) => tab === 'all' || a.scope === tab);
  return (
    <>
      <div className="toolbar">
        <SegmentedControl size="sm" value={tab} onChange={setTab} options={[
          { value:'all', label:'All' }, { value:'project', label:'Project' }, { value:'user', label:'User' }, { value:'plugin', label:'Plugin' },
        ]} />
        <div style={{ flex:1 }} />
        <div style={{ width:200 }}><Input size="sm" placeholder="Filter…" leadingIcon={<Ic.IconSearch s={14} />} /></div>
      </div>
      <div className="body">
        <div className="grid">
          {list.map((a) => (
            <Card key={a.id} interactive padding="var(--space-3)">
              <div style={{ display:'flex', alignItems:'center', gap:12 }}>
                <AgentTile hue={a.hue} running={a.running} />
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ display:'flex', alignItems:'center', gap:7 }}>
                    <span style={{ fontSize:14, fontWeight:600, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{a.name}</span>
                    {a.running ? <span style={{ fontSize:10.5, fontWeight:600, color:'var(--success)' }}>running</span> : null}
                  </div>
                  <div style={{ fontSize:12.5, color:'var(--text-tertiary)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', marginTop:2 }}>{a.desc}</div>
                </div>
              </div>
              <div className="meta" style={{ marginTop:12, justifyContent:'space-between' }}>
                <ScopeBadge scope={a.scope} source={a.source} />
                <span className="mono" style={{ display:'inline-flex', alignItems:'center', gap:5 }}><Ic.IconBrain s={13} />{a.model}</span>
              </div>
            </Card>
          ))}
        </div>
      </div>
    </>
  );
}

function Skills() {
  return (
    <>
      <div className="toolbar"><div style={{ flex:1 }} /><div style={{ width:200 }}><Input size="sm" placeholder="Filter skills…" leadingIcon={<Ic.IconSearch s={14} />} /></div></div>
      <div className="body">
        <div className="grid">
          {SKILLS.map((s) => (
            <Card key={s.n} interactive padding="var(--space-4)" style={{ display:'flex', flexDirection:'column', gap:8 }}>
              <span style={{ color:'var(--success)' }}><Ic.IconSparkles s={18} /></span>
              <div style={{ fontSize:14, fontWeight:600, fontFamily:'var(--font-mono)' }}>{s.n}</div>
              <div style={{ fontSize:13, color:'var(--text-tertiary)', lineHeight:1.5 }}>{s.d}</div>
              <Badge tone={s.s === 'project' ? 'info' : s.s === 'plugin' ? 'history' : 'neutral'} style={{ alignSelf:'flex-start' }}>{s.s}</Badge>
            </Card>
          ))}
        </div>
      </div>
    </>
  );
}

function Hooks() {
  const [hooks, setHooks] = useState(HOOKS);
  return (
    <div className="body" style={{ paddingTop:18 }}>
      <div className="col">
        {hooks.map((h, i) => (
          <Card key={h.event + h.matcher} padding="var(--space-3)">
            <div style={{ display:'flex', alignItems:'center', gap:10 }}>
              <Badge tone="warning">{h.event}</Badge>
              <span className="mono" style={{ fontSize:12, color:'var(--text-tertiary)' }}>{h.matcher}</span>
              <span className="mono" style={{ flex:1, fontSize:12, color:'var(--text-secondary)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{h.cmd}</span>
              <Switch checked={h.on} onChange={() => setHooks((l) => l.map((x, j) => j === i ? { ...x, on:!x.on } : x))} />
            </div>
          </Card>
        ))}
      </div>
    </div>
  );
}

function Mcp() {
  return (
    <div className="body" style={{ paddingTop:18 }}>
      <div className="col">
        {MCP.map((m) => (
          <Card key={m.name} interactive padding="var(--space-3)">
            <div style={{ display:'flex', alignItems:'center', gap:12 }}>
              <span style={{ color:'var(--accent-text)', display:'flex' }}><Ic.IconPlug s={18} /></span>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ display:'flex', alignItems:'center', gap:8 }}><span style={{ fontSize:14, fontWeight:600, fontFamily:'var(--font-mono)' }}>{m.name}</span><Badge tone="neutral">{m.transport}</Badge></div>
                <div style={{ fontSize:12, color:'var(--text-tertiary)', marginTop:2 }}>{m.tools} tools</div>
              </div>
              {m.status === 'connected' ? <Badge tone="success" dot shape="pill">connected</Badge> : <Badge tone="danger" dot shape="pill">error</Badge>}
            </div>
          </Card>
        ))}
      </div>
    </div>
  );
}

const HEAD = {
  agents: ['Agents', 'Specialized agents Claude can delegate to — from your project, your account, or installed plugins.', 'New agent'],
  skills: ['Skills', 'Reusable workflows Claude can call on demand.', 'New skill'],
  hooks: ['Hooks', 'Shell commands that run on Claude Code lifecycle events.', 'New hook'],
  mcp: ['MCP servers', 'Model Context Protocol servers that give Claude new tools and data.', 'Add server'],
};
const PANES = { agents:Agents, skills:Skills, hooks:Hooks, mcp:Mcp };

function App() {
  const [cat, setCat] = useState('agents');
  const Pane = PANES[cat];
  const [title, desc, cta] = HEAD[cat];
  return (
    <div className="app">
      <div className="topbar">
        <span className="brand"><svg width="22" height="22" viewBox="0 0 96 96" fill="none"><rect width="96" height="96" rx="24" fill="#5b6cf0"/><path d="M33 30 L51 48 L33 66" stroke="#fff" strokeWidth="8" strokeLinecap="round" strokeLinejoin="round"/><path d="M58 66 H70" stroke="#fff" strokeWidth="8" strokeLinecap="round"/></svg> ClaudeIn</span>
        <span className="crumb">/ Library</span>
        <div style={{ flex:1 }} />
        <Button intent="ghost" size="sm" leftIcon={<Ic.IconHome s={15} />}>Home</Button>
      </div>
      <div className="main">
        <div className="rail">
          <SegmentedControl size="sm" value="library" onChange={()=>{}} style={{ display:'flex', width:'100%' }}
            options={[{ value:'sessions', label:<span style={{whiteSpace:'nowrap'}}>Sessions</span> }, { value:'library', label:<span style={{whiteSpace:'nowrap'}}>Library</span> }]} />
          <div className="nav">
            {NAV.map((n) => (
              <button key={n.id} className={'navitem ' + (n.id === cat ? 'on' : '')} onClick={() => setCat(n.id)}>
                <span style={{ display:'flex', color: n.id === cat ? 'var(--accent-text)' : 'var(--text-tertiary)' }}>{n.icon}</span>
                {n.label}<span className="cnt">{n.count}</span>
              </button>
            ))}
          </div>
        </div>
        <div className="content">
          <div className="chead">
            <div><h1>{title}</h1><p>{desc}</p></div>
            <Button intent="primary" size="sm" leftIcon={<Ic.IconPlus s={15} />}>{cta}</Button>
          </div>
          <Pane />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
