<!-- @dsCard group="Dashboard" viewport="900x1180" name="Fil de chat — avant / après" subtitle="Lisibilité, distinction You/Claude, bloc d'autorisation" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaudeIn — Chat thread</title>
<link rel="icon" type="image/svg+xml" href="../../assets/claudein-favicon.svg">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-base); color: var(--text-primary); }
  .page { max-width: 820px; margin: 0 auto; padding: 30px 28px 64px; display: flex; flex-direction: column; gap: 14px; }
  .flabel { display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-tertiary); margin-top: 14px; }
  .flabel .pill { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0; text-transform: none; border-radius: var(--radius-pill); padding: 2px 9px; }
  .pill-old { color: var(--text-tertiary); background: var(--surface-2); border: 1px solid var(--border); }
  .pill-new { color: var(--accent-text); background: var(--accent-subtle); border: 1px solid var(--accent-border); }

  /* AVANT */
  .old { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 18px; font-family: var(--font-mono); font-size: 13px; line-height: 1.7; background: var(--surface-1); }
  .old .u { color: var(--accent-text); }
  .old .lbl { color: var(--text-tertiary); }
  .old .body { color: var(--text-secondary); margin: 4px 0 18px; }
  .old .authbtn { border: 1px solid; border-radius: var(--radius-md); padding: 12px 14px; margin-top: 8px; }

  /* APRÈS */
  .thread { display: flex; flex-direction: column; gap: 18px; }
  .turn { display: flex; gap: 12px; }
  .av { flex-shrink: 0; width: 30px; height: 30px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; }
  .av.claude { background: color-mix(in srgb, var(--accent-text) 16%, var(--surface-2)); border: 1px solid color-mix(in srgb, var(--accent-text) 30%, transparent); color: var(--accent-text); }
  .who { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
  .who .name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
  .who .time { font-size: 11px; color: var(--text-tertiary); font-family: var(--font-mono); }
  .col { flex: 1; min-width: 0; }
  .said { font-size: 14.5px; line-height: 1.62; color: var(--text-secondary); }
  .said p { margin: 0 0 9px; }
  .said p:last-child { margin-bottom: 0; }
  .chip { font-family: var(--font-mono); font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-xs); padding: 1px 6px; color: var(--text-primary); white-space: nowrap; }
  /* user turn: light bubble, right-tinted */
  .turn.user .col { display: flex; flex-direction: column; align-items: flex-start; }
  .bubble { background: var(--accent-subtle); border: 1px solid var(--accent-border); border-radius: var(--radius-lg); padding: 11px 14px; font-size: 14.5px; color: var(--text-primary); line-height: 1.55; }
  .av.user { background: var(--surface-3); border: 1px solid var(--border-strong); color: var(--text-secondary); }
</style>
</head>
<body>
<div class="page" id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="./icons.jsx"></script>
<script type="text/babel">
const { Button, Badge, IconButton } = window.ClaudeInDesignSystem_25db6c;
const Ic = window.ClaudeInIcons;

function Claude({ time, children }) {
  return (
    <div className="turn">
      <span className="av claude"><Ic.IconBot s={17} /></span>
      <div className="col">
        <div className="who"><span className="name">Claude</span><span className="time">{time}</span></div>
        <div className="said">{children}</div>
      </div>
    </div>
  );
}
function You({ time, children }) {
  return (
    <div className="turn user">
      <span className="av user"><Ic.IconChevron s={15} /></span>
      <div className="col">
        <div className="who"><span className="name">You</span><span className="time">{time}</span></div>
        <div className="bubble">{children}</div>
      </div>
    </div>
  );
}

function App() {
  return (
    <>
      <div className="flabel">Avant <span className="pill pill-old">actuel</span></div>
      <div className="old">
        <div className="u">@slack-assistant envoi moi un message pour me dire ok. en background</div>
        <div style={{ marginTop:14 }}><span className="lbl">Claude</span></div>
        <div className="body">C'est parti — le slack-assistant tourne en background pour t'envoyer "ok" sur Slack.</div>
        <div className="lbl">Claude</div>
        <div className="body">The send was blocked. The slack_send_message permission was denied…</div>
        <div style={{ color:'var(--warning)' }}>⛉ Authorization</div>
        <div className="body">Veux-tu approuver l'envoi du message Slack ?</div>
        <div className="authbtn" style={{ borderColor:'var(--success)', color:'var(--success)' }}>› Oui</div>
        <div className="authbtn" style={{ borderColor:'var(--success)', color:'var(--success)' }}>Oui, toujours</div>
        <div className="authbtn" style={{ borderColor:'var(--danger)', color:'var(--danger)' }}>Non</div>
      </div>

      <div className="flabel">Après <span className="pill pill-new">design system</span></div>
      <div className="thread">
        <You time="09:58:02">@slack-assistant envoie-moi un message pour me dire ok. en background</You>

        <Claude time="09:58:10">
          <p>C'est parti — le <span className="chip">slack-assistant</span> tourne en background pour t'envoyer « ok » sur Slack. Je te préviens dès qu'il a terminé.</p>
          <p>The send was blocked. The <span className="chip">slack_send_message</span> permission was denied, so I couldn't post to your DM — and I won't try to work around that denial.</p>
        </Claude>

        <You time="09:59:29">@aria-requirements-auditor lance toi</You>

        {/* Authorization card */}
        <div className="turn">
          <span className="av" style={{ background:'var(--warning-subtle)', border:'1px solid color-mix(in srgb, var(--warning) 35%, transparent)', color:'var(--warning)' }}><Ic.IconShield s={16} /></span>
          <div className="col">
            <div className="who"><span className="name" style={{ color:'var(--warning)' }}>Authorization requise</span></div>
            <div style={{ background:'var(--surface-1)', border:'1px solid color-mix(in srgb, var(--warning) 28%, var(--border))', borderRadius:'var(--radius-lg)', padding:'16px', boxShadow:'var(--shadow-sm)' }}>
              <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:10 }}>
                <Badge tone="warning">slack</Badge>
                <span className="chip">mcp__claude_ai_Slack__slack_send_message</span>
              </div>
              <div className="said" style={{ marginBottom:16 }}>
                Le message n'a pas pu partir : la permission ci-dessus a été refusée, donc l'agent n'a pas pu poster sur ta DM (<span className="chip">self-DM U0ADAAPA8BW</span>). Si tu approuves, je relance l'envoi de « ok » tout de suite.
              </div>
              <div style={{ display:'flex', alignItems:'center', gap:10, flexWrap:'wrap' }}>
                <Button intent="primary" leftIcon={<Ic.IconCheck s={15} />}>Approuver</Button>
                <Button intent="secondary">Toujours autoriser</Button>
                <div style={{ flex:1 }} />
                <Button intent="danger">Refuser</Button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
