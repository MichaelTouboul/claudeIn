<!-- @dsCard group="Dashboard" viewport="1280x720" name="Dashboard" subtitle="Sidebar · chat surface · console · composer" -->
<!-- @startingPoint section="Screens" subtitle="ClaudeIn dashboard — the chat workspace" viewport="1280x800" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ClaudeIn — Dashboard</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; background: var(--surface-base); color: var(--text-primary); }
  #root { height: 100vh; }
  .app { height: 100vh; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 12px; height: var(--header-height); padding: 0 16px; background: var(--surface-1); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  .proj { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-secondary); padding: 5px 10px; border-radius: var(--radius-md); border: 1px solid var(--border); }
  .stat { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 12px; color: var(--text-tertiary); }
  .main { flex: 1; min-height: 0; display: flex; }
  .side { width: var(--sidebar-width); flex-shrink: 0; background: var(--surface-1); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
  .zone { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-tertiary); padding: 16px 14px 6px; }
  .conv { display: flex; align-items: center; gap: 9px; margin: 0 8px; padding: 8px 10px; border-radius: var(--radius-md); cursor: pointer; color: var(--text-secondary); transition: background var(--duration-fast) var(--ease-standard); }
  .conv:hover { background: var(--surface-2); }
  .conv.on { background: var(--accent-subtle); color: var(--accent-text); }
  .conv .t { flex: 1; min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .libitem { display: flex; align-items: center; gap: 10px; margin: 0 8px; padding: 8px 10px; border-radius: var(--radius-md); cursor: pointer; color: var(--text-secondary); font-size: 13px; transition: background var(--duration-fast) var(--ease-standard); }
  .libitem:hover { background: var(--surface-2); color: var(--text-primary); }
  .libitem .cnt { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); }
  .center { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .tabs { display: flex; align-items: stretch; gap: 2px; height: 38px; background: var(--surface-1); border-bottom: 1px solid var(--border); padding: 0 8px; }
  .tab { display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 13px; color: var(--text-tertiary); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  .tab.on { color: var(--text-primary); border-bottom-color: var(--accent); background: var(--surface-base); }
  .chat { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 22px; }
  .msg .head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .msg .role { font-size: 12px; font-weight: 600; }
  .msg .time { font-size: 11px; color: var(--text-tertiary); font-family: var(--font-mono); opacity: 0; }
  .msg:hover .time { opacity: 1; }
  .msg .text { font-size: 14px; line-height: 1.6; color: var(--text-secondary); }
  .bubble { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px 14px; color: var(--text-primary); font-size: 14px; }
  .well { background: var(--surface-inset); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px 12px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.7; overflow-x: auto; }
  .composer { border-top: 1px solid var(--border); background: var(--surface-1); padding: 14px 16px; }
  .cbar { display: flex; align-items: flex-end; gap: 10px; background: var(--surface-inset); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); padding: 8px 10px; }
  .cbar.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-subtle); }
  .cinput { flex: 1; min-height: 24px; max-height: 120px; border: none; outline: none; background: transparent; color: var(--text-primary); font-family: var(--font-sans); font-size: 14px; resize: none; line-height: 1.5; padding: 4px 0; }
  .console { border-top: 1px solid var(--border); background: var(--surface-inset); height: 152px; display: flex; flex-direction: column; }
  .console.collapsed { height: 38px; }
  .conhead { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; flex-shrink: 0; cursor: pointer; }
  .conbody { flex: 1; overflow-y: auto; padding: 4px 14px 12px; font-family: var(--font-mono); font-size: 12px; line-height: 1.75; }
  .footer { display: flex; align-items: center; gap: 10px; height: 26px; padding: 0 14px; background: var(--surface-1); border-top: 1px solid var(--border); font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); flex-shrink: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="./icons.jsx"></script>
<script type="text/babel">
const { useState, useRef, useEffect } = React;
const { Button, Badge, Avatar, IconButton, StatusDot, Tag } = window.ClaudeInDesignSystem_25db6c;
const Ic = window.ClaudeInIcons;

const SEED = [
  { id: 'm1', role: 'user', text: 'Refactor the auth middleware to use the new TokenService.' },
  { id: 'm2', role: 'agent', text: "I'll read the current middleware and the token service first, then make the change." },
  { id: 'm3', role: 'tool', tool: 'Read', body: 'src/auth/middleware.ts  ·  src/services/token.service.ts' },
  { id: 'm4', role: 'agent', text: 'The middleware verifies tokens inline. I can delegate to TokenService.verify():', diff: [
    { t: 'del', s: "-  const payload = jwt.verify(token, SECRET);" },
    { t: 'add', s: "+  const payload = await tokenService.verify(token);" },
  ], file: 'src/auth/middleware.ts' },
  { id: 'm5', role: 'auth', text: 'Run the test suite to confirm nothing broke?' },
];

function Role({ msg }) {
  if (msg.role === 'user') return <><Ic.IconChevron s={14} /><span className="role" style={{ color: 'var(--accent-text)' }}>You</span></>;
  if (msg.role === 'tool') return <><span style={{ color: 'var(--warning)', display: 'flex' }}><Ic.IconWrench s={13} /></span><span className="role mono" style={{ color: 'var(--warning)' }}>{msg.tool}</span></>;
  if (msg.role === 'auth') return <><span style={{ color: 'var(--warning)', display: 'flex' }}><Ic.IconShield s={14} /></span><span className="role" style={{ color: 'var(--warning)' }}>Authorization</span></>;
  return <><span style={{ color: 'var(--text-tertiary)', display: 'flex' }}><Ic.IconBot s={14} /></span><span className="role" style={{ color: 'var(--text-secondary)' }}>Claude</span></>;
}

function Message({ msg, onAnswer, live }) {
  return (
    <div className="msg">
      <div className="head"><Role msg={msg} /><span className="time">14:0{msg.id.slice(1)}</span></div>
      <div style={{ marginLeft: 22 }}>
        {msg.role === 'user' ? <div className="bubble">{msg.text}</div> : null}
        {msg.role === 'agent' ? <div className="text">{msg.text}</div> : null}
        {msg.role === 'tool' ? <div className="well" style={{ color: 'var(--text-tertiary)' }}>{msg.body}</div> : null}
        {msg.diff ? (
          <div style={{ marginTop: 10 }}>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--text-tertiary)', marginBottom: 5 }}>{msg.file}</div>
            <div className="well">
              {msg.diff.map((d, i) => <div key={i} style={{ color: d.t === 'add' ? 'var(--success)' : 'var(--danger)' }}>{d.s}</div>)}
            </div>
          </div>
        ) : null}
        {msg.role === 'auth' ? (
          <div style={{ marginTop: 4 }}>
            <div className="text" style={{ marginBottom: 10 }}>{msg.text}</div>
            {msg.answered ? <Badge tone={msg.answered === 'yes' ? 'success' : 'neutral'} dot>{msg.answered === 'yes' ? 'approved' : 'declined'}</Badge> : live ? (
              <div style={{ display: 'flex', gap: 8 }}>
                <Button intent="primary" size="sm" onClick={() => onAnswer(msg.id, 'yes')}>Approve &amp; run</Button>
                <Button intent="ghost" size="sm" onClick={() => onAnswer(msg.id, 'no')}>Decline</Button>
              </div>
            ) : null}
          </div>
        ) : null}
      </div>
    </div>
  );
}

function App() {
  const [msgs, setMsgs] = useState(SEED);
  const [input, setInput] = useState('');
  const [focus, setFocus] = useState(false);
  const [tab, setTab] = useState('refactor');
  const [conOpen, setConOpen] = useState(true);
  const chatRef = useRef(null);

  useEffect(() => { if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight; }, [msgs]);

  const answer = (id, val) => setMsgs((m) => m.map((x) => x.id === id ? { ...x, answered: val } : x));
  const send = () => {
    if (!input.trim()) return;
    const uid = 'u' + Date.now();
    setMsgs((m) => [...m, { id: uid, role: 'user', text: input.trim() }]);
    setInput('');
    setTimeout(() => setMsgs((m) => [...m, { id: 'a' + Date.now(), role: 'agent', text: 'Got it — working on that now. I\u2019ll keep you posted in the console below.' }]), 600);
  };

  const lastAuthId = [...msgs].reverse().find((m) => m.role === 'auth' && !m.answered)?.id;

  return (
    <div className="app">
      <div className="topbar">
        <span className="brand"><svg width="22" height="22" viewBox="0 0 32 32" fill="none" style={{ color: 'var(--accent-text)' }}><path d="M9 8.5 L17 16 L9 23.5" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" /><path d="M20.5 23.5 L25 23.5" stroke="currentColor" strokeWidth="3" strokeLinecap="round" /></svg> ClaudeIn</span>
        <Button intent="ghost" size="sm" leftIcon={<Ic.IconHome s={15} />}>Home</Button>
        <span className="proj"><Avatar name="claudein" hue="blue" square size="xs" /> claudein <Ic.IconChevronDown s={13} /></span>
        <div style={{ flex: 1 }} />
        <span className="stat"><StatusDot status="live" pulse /> Live</span>
        <span className="stat" style={{ color: 'var(--accent-text)' }}><Ic.IconActivity s={13} /> 2 active</span>
        <Button intent="secondary" size="sm" leftIcon={<Ic.IconMessage s={14} />}>Chat</Button>
      </div>

      <div className="main">
        <div className="side">
          <div className="zone">Activity</div>
          <div className="conv on"><StatusDot status="live" pulse /><span className="t">Refactor auth middleware</span></div>
          <div className="conv"><StatusDot status="idle" /><span className="t">Set up CI pipeline</span></div>
          <div className="conv"><StatusDot status="idle" /><span className="t">Fix flaky tests</span><Badge tone="neutral" shape="pill">3</Badge></div>
          <div className="zone">Library</div>
          <div className="libitem"><span style={{ color: 'var(--info)' }}><Ic.IconBot s={15} /></span> Sub-agents <span className="cnt">6</span></div>
          <div className="libitem"><span style={{ color: 'var(--success)' }}><Ic.IconSparkles s={15} /></span> Skills <span className="cnt">12</span></div>
          <div className="libitem"><span style={{ color: 'var(--warning)' }}><Ic.IconZap s={15} /></span> Hooks <span className="cnt">3</span></div>
          <div className="libitem"><span style={{ color: 'var(--history)' }}><Ic.IconBrain s={15} /></span> Memory <span className="cnt">5</span></div>
          <div className="libitem"><span style={{ color: 'var(--text-tertiary)' }}><Ic.IconClock s={15} /></span> Sessions <span className="cnt">48</span></div>
        </div>

        <div className="center">
          <div className="tabs">
            <div className={'tab ' + (tab === 'refactor' ? 'on' : '')} onClick={() => setTab('refactor')}><StatusDot status="live" pulse /> Refactor auth middleware</div>
            <div className={'tab ' + (tab === 'ci' ? 'on' : '')} onClick={() => setTab('ci')}>Set up CI pipeline</div>
            <div className="tab" style={{ color: 'var(--text-tertiary)' }}><Ic.IconPlus s={14} /></div>
          </div>

          <div className="chat" ref={chatRef}>
            {msgs.map((m) => <Message key={m.id} msg={m} onAnswer={answer} live={m.id === lastAuthId} />)}
          </div>

          <div className="composer">
            <div className={'cbar ' + (focus ? 'focus' : '')}>
              <span style={{ color: 'var(--accent-text)', display: 'flex', paddingBottom: 4 }}><Ic.IconChevron s={16} /></span>
              <textarea className="cinput" rows="1" placeholder="Type a prompt, / for commands or @ to mention…" value={input}
                onChange={(e) => setInput(e.target.value)} onFocus={() => setFocus(true)} onBlur={() => setFocus(false)}
                onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }} />
              <Tag>Claude Sonnet</Tag>
              <IconButton aria-label="Attach"><Ic.IconPaperclip s={16} /></IconButton>
              <IconButton aria-label="Send" intent="primary" onClick={send}><Ic.IconSend s={16} /></IconButton>
            </div>
          </div>
        </div>
      </div>

      <div className={'console ' + (conOpen ? '' : 'collapsed')}>
        <div className="conhead" onClick={() => setConOpen((v) => !v)}>
          <Ic.IconTerminal s={14} style={{ color: 'var(--text-tertiary)' }} />
          <span style={{ fontSize: 12, fontWeight: 600, color: 'var(--text-secondary)' }}>Console</span>
          <Badge tone="neutral" shape="pill">events</Badge>
          <div style={{ flex: 1 }} />
          <Ic.IconChevronDown s={15} style={{ color: 'var(--text-tertiary)', transform: conOpen ? 'none' : 'rotate(180deg)' }} />
        </div>
        {conOpen ? (
          <div className="conbody">
            <div style={{ color: 'var(--text-tertiary)' }}><span style={{ color: 'var(--success)' }}>●</span> 14:02:11  session started · claude-sonnet-4</div>
            <div style={{ color: 'var(--text-tertiary)' }}><span style={{ color: 'var(--warning)' }}>●</span> 14:03:48  tool:Read  src/auth/middleware.ts</div>
            <div style={{ color: 'var(--text-tertiary)' }}><span style={{ color: 'var(--info)' }}>●</span> 14:04:02  edit applied · +1 −1 · middleware.ts</div>
            <div style={{ color: 'var(--text-secondary)' }}>$ npm test <span style={{ color: 'var(--text-tertiary)' }}>— awaiting approval</span></div>
          </div>
        ) : null}
      </div>

      <div className="footer"><span>claudein</span><span>·</span><span>feature/redesign</span><span>·</span><span>$0.4821</span><span>·</span><span>12,480 tokens</span><div style={{ flex: 1 }} /><span>ClaudeIn 1.0</span></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
