<!-- @dsCard group="Dashboard" viewport="1280x720" name="Sidebar Sessions ⟷ Library (chat conservé)" subtitle="Le switch ne change que la sidebar — le chat central reste" -->
<!-- @startingPoint section="Screens" subtitle="ClaudeIn dashboard — sidebar switch + chat" viewport="1280x800" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaudeIn — Sidebar switch</title>
<link rel="icon" type="image/svg+xml" href="../../assets/claudein-favicon.svg">
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; background: var(--surface-base); color: var(--text-primary); }
  #root { height: 100vh; }
  .app { height: 100vh; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 12px; height: var(--header-height); padding: 0 16px; background: var(--surface-1); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  .proj { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-secondary); padding: 5px 10px; border-radius: var(--radius-md); border: 1px solid var(--border); }
  .stat { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 12px; color: var(--text-tertiary); }
  .main { flex: 1; min-height: 0; display: flex; }

  /* sidebar */
  .side { width: var(--sidebar-width); flex-shrink: 0; background: var(--surface-1); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .switch-wrap { padding: 12px 12px 8px; }
  .grp { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-tertiary); padding: 12px 16px 6px; }
  .sessrow { margin: 0 8px; padding: 9px 10px; border-radius: var(--radius-md); cursor: pointer; transition: background var(--duration-fast) var(--ease-standard); }
  .sessrow:hover { background: var(--surface-2); }
  .sessrow.on { background: var(--accent-subtle); }
  .navitem { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; margin: 0 8px; border: none; background: transparent; border-radius: var(--radius-md); color: var(--text-secondary); font-family: var(--font-sans); font-size: 14px; cursor: pointer; text-align: left; width: calc(100% - 16px); transition: background var(--duration-fast) var(--ease-standard); }
  .navitem:hover { background: var(--surface-2); color: var(--text-primary); }
  .navitem .cnt { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); }

  /* center chat (CONSTANT across both states) */
  .center { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .tabs { display: flex; align-items: stretch; gap: 2px; height: 38px; background: var(--surface-1); border-bottom: 1px solid var(--border); padding: 0 8px; }
  .tab { display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 13px; color: var(--text-tertiary); border-bottom: 2px solid transparent; white-space: nowrap; }
  .tab.on { color: var(--text-primary); border-bottom-color: var(--accent); background: var(--surface-base); }
  .chat { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 22px; }
  .msg .head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .msg .role { font-size: 12px; font-weight: 600; }
  .bubble { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px 14px; color: var(--text-primary); font-size: 14px; max-width: 640px; }
  .text { font-size: 14px; line-height: 1.6; color: var(--text-secondary); max-width: 640px; }
  .well { background: var(--surface-inset); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px 12px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.7; }
  .composer { border-top: 1px solid var(--border); background: var(--surface-1); padding: 14px 16px; }
  .cbar { display: flex; align-items: center; gap: 10px; background: var(--surface-inset); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); padding: 8px 10px; }
  .cinput { flex: 1; border: none; outline: none; background: transparent; color: var(--text-primary); font-family: var(--font-sans); font-size: 14px; }
  .hintbar { display: flex; align-items: center; gap: 8px; padding: 9px 12px; margin: 0 8px 8px; border-radius: var(--radius-md); background: var(--accent-subtle); border: 1px solid var(--accent-border); color: var(--text-secondary); font-size: 12px; line-height: 1.45; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="./icons.jsx"></script>
<script type="text/babel">
const { useState } = React;
const { Button, Badge, Avatar, IconButton, StatusDot, Tag, SegmentedControl, Input } = window.ClaudeInDesignSystem_25db6c;
const Ic = window.ClaudeInIcons;
const HUE = { cyan:'var(--agent-cyan)', blue:'var(--agent-blue)', green:'var(--agent-green)', purple:'var(--agent-purple)', red:'var(--agent-red)', orange:'var(--agent-orange)', pink:'var(--agent-pink)' };

const SESS = [
  { g:'Today', items:[
    { id:'s1', title:'Refactor auth middleware', branch:'feature/auth', msgs:8, tok:'2.0k', time:'2h', active:true },
    { id:'s2', title:'Update onboarding screens', branch:'main', msgs:12, tok:'9.9k', time:'4h' },
  ]},
  { g:'Yesterday', items:[
    { id:'s3', title:'Set up CI pipeline', branch:'main', msgs:6, tok:'1.2k', time:'18:41' },
    { id:'s4', title:'Fix flaky e2e tests', branch:'fix/e2e', msgs:9, tok:'2.1k', time:'15:02' },
  ]},
];
const LIB = [
  { icon:<Ic.IconBot s={17} />, color:'var(--info)', label:'Agents', count:25 },
  { icon:<Ic.IconSparkles s={17} />, color:'var(--success)', label:'Skills', count:10 },
  { icon:<Ic.IconZap s={17} />, color:'var(--warning)', label:'Hooks', count:1 },
  { icon:<Ic.IconPlug s={17} />, color:'var(--accent-text)', label:'MCP servers', count:4 },
];

/* ---- The chat in the center NEVER changes when the sidebar switches ---- */
function Chat() {
  return (
    <div className="center">
      <div className="tabs">
        <div className="tab on"><StatusDot status="live" pulse /> Refactor auth middleware</div>
        <div className="tab">Update onboarding screens</div>
        <div className="tab" style={{ color:'var(--text-tertiary)' }}><Ic.IconPlus s={14} /></div>
      </div>
      <div className="chat">
        <div className="msg">
          <div className="head"><Ic.IconChevron s={14} /><span className="role" style={{ color:'var(--accent-text)' }}>You</span></div>
          <div style={{ marginLeft:22 }}><div className="bubble">Refactor the auth middleware to use the new TokenService.</div></div>
        </div>
        <div className="msg">
          <div className="head"><span style={{ color:'var(--text-tertiary)', display:'flex' }}><Ic.IconBot s={14} /></span><span className="role" style={{ color:'var(--text-secondary)' }}>Claude</span></div>
          <div style={{ marginLeft:22 }}><div className="text">I'll read the current middleware and the token service, then make the change.</div></div>
        </div>
        <div className="msg">
          <div className="head"><span style={{ color:'var(--warning)', display:'flex' }}><Ic.IconWrench s={13} /></span><span className="role mono" style={{ color:'var(--warning)' }}>Read</span></div>
          <div style={{ marginLeft:22 }}><div className="well" style={{ color:'var(--text-tertiary)' }}>src/auth/middleware.ts · src/services/token.service.ts</div></div>
        </div>
        <div className="msg">
          <div className="head"><span style={{ color:'var(--text-tertiary)', display:'flex' }}><Ic.IconBot s={14} /></span><span className="role" style={{ color:'var(--text-secondary)' }}>Claude</span></div>
          <div style={{ marginLeft:22 }}>
            <div className="text" style={{ marginBottom:10 }}>Delegating verification to TokenService:</div>
            <div className="well"><div style={{ color:'var(--danger)' }}>-  const payload = jwt.verify(token, SECRET);</div><div style={{ color:'var(--success)' }}>+  const payload = await tokenService.verify(token);</div></div>
          </div>
        </div>
      </div>
      <div className="composer">
        <div className="cbar">
          <span style={{ color:'var(--accent-text)', display:'flex' }}><Ic.IconChevron s={16} /></span>
          <input className="cinput" placeholder="Type a prompt, / for commands or @ to mention…" />
          <Tag>Claude Sonnet</Tag>
          <IconButton aria-label="Send" intent="primary"><Ic.IconSend s={16} /></IconButton>
        </div>
      </div>
    </div>
  );
}

function Sidebar({ view, setView }) {
  return (
    <div className="side">
      <div className="switch-wrap">
        <SegmentedControl value={view} onChange={setView} style={{ display:'flex', width:'100%' }}
          options={[{ value:'sessions', label:<span style={{whiteSpace:'nowrap'}}>Sessions</span> }, { value:'library', label:<span style={{whiteSpace:'nowrap'}}>Library</span> }]} />
      </div>

      {view === 'sessions' ? (
        <div style={{ flex:1, overflowY:'auto' }}>
          <div style={{ padding:'2px 12px 6px' }}><Input size="sm" placeholder="Search sessions…" leadingIcon={<Ic.IconSearch s={13} />} /></div>
          {SESS.map((grp) => (
            <div key={grp.g}>
              <div className="grp">{grp.g}</div>
              {grp.items.map((s) => (
                <div key={s.id} className={'sessrow ' + (s.active ? 'on' : '')}>
                  <div style={{ display:'flex', alignItems:'baseline', gap:8 }}>
                    <span style={{ flex:1, minWidth:0, fontSize:13, fontWeight:500, color: s.active ? 'var(--accent-text)' : 'var(--text-primary)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{s.title}</span>
                    <span className="mono" style={{ fontSize:10.5, color:'var(--text-tertiary)' }}>{s.time}</span>
                  </div>
                  <div style={{ display:'flex', alignItems:'center', gap:7, marginTop:4, color:'var(--text-tertiary)', fontSize:11.5 }}>
                    <span style={{ display:'inline-flex', alignItems:'center', gap:4, maxWidth:120 }}><Ic.IconGitBranch s={12} /><span style={{ overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{s.branch}</span></span>
                    <span style={{ color:'var(--border-strong)' }}>·</span>
                    <span style={{ display:'inline-flex', alignItems:'center', gap:4 }}><Ic.IconMessage s={12} />{s.msgs}</span>
                  </div>
                </div>
              ))}
            </div>
          ))}
        </div>
      ) : (
        <div style={{ flex:1, overflowY:'auto', paddingTop:4 }}>
          <div className="hintbar"><span style={{ color:'var(--accent-text)', display:'flex', flexShrink:0 }}><Ic.IconBoxes s={15} /></span> Browse your library — your chat stays open on the right.</div>
          {LIB.map((l) => (
            <button key={l.label} className="navitem">
              <span style={{ color:l.color, display:'flex' }}>{l.icon}</span>
              <span style={{ flex:1 }}>{l.label}</span>
              <span className="cnt">{l.count}</span>
              <span style={{ color:'var(--text-tertiary)', display:'flex' }}><Ic.IconChevron s={15} /></span>
            </button>
          ))}
        </div>
      )}

      <div style={{ borderTop:'1px solid var(--border-subtle)', padding:'10px 16px', display:'flex', alignItems:'center', gap:7, color:'var(--text-tertiary)', fontSize:12.5, cursor:'pointer' }}>
        <Ic.IconPlus s={14} /> {view === 'sessions' ? 'New session' : 'Install from plugin'}
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState('sessions');
  return (
    <div className="app">
      <div className="topbar">
        <span className="brand"><svg width="22" height="22" viewBox="0 0 96 96" fill="none"><rect width="96" height="96" rx="24" fill="#5b6cf0"/><path d="M33 30 L51 48 L33 66" stroke="#fff" strokeWidth="8" strokeLinecap="round" strokeLinejoin="round"/><path d="M58 66 H70" stroke="#fff" strokeWidth="8" strokeLinecap="round"/></svg> ClaudeIn</span>
        <Button intent="ghost" size="sm" leftIcon={<Ic.IconHome s={15} />}>Home</Button>
        <span className="proj"><Avatar name="claudein" hue="blue" square size="xs" /> claudein <Ic.IconChevronDown s={13} /></span>
        <div style={{ flex:1 }} />
        <span className="stat"><StatusDot status="live" pulse /> Live</span>
        <span className="stat" style={{ color:'var(--accent-text)' }}><Ic.IconActivity s={13} /> 2 active</span>
      </div>
      <div className="main">
        <Sidebar view={view} setView={setView} />
        <Chat />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
