<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="App logo concept">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="1" stop-color="#06080c"/>
    </linearGradient>
    <linearGradient id="cyan" x1="34" y1="44" x2="86" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- app-icon rounded square -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#bg)" stroke="#1e2636" stroke-width="2"/>

  <!-- subtle inner ring (the "orbit"/companion nod) -->
  <circle cx="64" cy="64" r="40" stroke="#06b6d4" stroke-opacity="0.14" stroke-width="2"/>

  <!-- terminal prompt chevron ">" -->
  <path d="M40 44 L60 64 L40 84" stroke="url(#cyan)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>

  <!-- blinking-cursor underscore "_" -->
  <rect x="68" y="78" width="24" height="8" rx="4" fill="url(#cyan)" filter="url(#glow)"/>

  <!-- spark / active dot (the "live" pillar) -->
  <circle cx="92" cy="40" r="5" fill="#4ade80"/>
</svg>
