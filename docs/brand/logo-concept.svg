<svg width="128" height="128" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="App logo concept">
  <defs>
    <linearGradient id="ci-concept-grad" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8e9bff"/>
      <stop offset="1" stop-color="#4a59d6"/>
    </linearGradient>
  </defs>

  <!-- app-icon rounded square: gradient indigo tile -->
  <rect width="96" height="96" rx="24" fill="url(#ci-concept-grad)"/>

  <!-- terminal prompt chevron ">" -->
  <path d="M33 30 L51 48 L33 66" stroke="#15171c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- cursor underscore "_" -->
  <path d="M58 66 H70" stroke="#15171c" stroke-width="8" stroke-linecap="round"/>

  <!-- spark / active dot (the "live" pillar) -->
  <circle cx="70" cy="28" r="6.5" fill="#45d483" stroke="#15171c" stroke-width="4"/>
</svg>
